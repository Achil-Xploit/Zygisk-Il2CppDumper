name: Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
        cache: gradle
    - run: |
        chmod +x ./gradlew
        sed -i 's/moduleDescription = "/moduleDescription = "(${{ github.event.inputs.package_name }}) /g' module.gradle
        sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h
        ./gradlew :module:assembleRelease
        
        # Buat folder output dan cari file zip secara otomatis dari direktori project
        mkdir -p out/magisk_module_release/
        find . -type f -name "*.zip" -exec cp {} out/magisk_module_release/ \;
        
        # Pindah ke folder output dan ubah nama file zip
        cd out/magisk_module_release/
        for f in *.zip; do
          [ -f "$f" ] && mv "$f" "Zygisk-Il2CppDumper-${{ github.event.inputs.package_name }}.zip"
        done
    - uses: actions/upload-artifact@v5
      with:
        name: zygisk-il2cppdumper-${{ github.event.inputs.package_name }}
        path: out/magisk_module_release/
